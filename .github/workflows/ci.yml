name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests/test_uncertainty.py tests/test_pilot_sessions.py tests/test_pilot_ai.py tests/test_pilot_ops.py -q
      - name: Smoke check single user
        run: python tests/smoke_check.py
        env:
          PILOT_MODE: "0"
      - name: Smoke check pilot
        run: python tests/smoke_check.py
        env:
          PILOT_MODE: "1"
          COURSE_CODE: "TEST2026"
          ROSTER_FILE: "docs/名单示例.csv"
